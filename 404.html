<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Página mostrada pelo GitHub Pages quando um endereço não existe.
       Usa caminhos absolutos (/...) porque pode ser exibida em qualquer endereço. -->
  <title>Página não encontrada | Inflaming Hearts</title>
  <meta name="robots" content="noindex">

  <!-- Ícones (a partir do avatar da marca). TODO: versão simplificada em SVG. -->
  <link rel="icon" href="/assets/icons/favicon-48.png" type="image/png" sizes="48x48">
  <link rel="icon" href="/assets/icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1B1F24">

  <!-- Fontes locais: Cinzel (títulos) + Inter (texto) -->
  <link rel="stylesheet" href="/css/fontes.css">

  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-header__brand" href="/">
        <img src="/assets/img/simbolo-96.png" alt="" width="36" height="36">
        <span class="site-header__nome">Inflaming Hearts</span>
      </a>
    </div>
  </header>

  <main>
    <section class="section section--hero" aria-labelledby="erro-titulo">
      <div class="container hero">
        <h1 id="erro-titulo" class="hero__titulo">Página não encontrada</h1>
        <p class="hero__apoio">O endereço que você tentou abrir não existe ou mudou de lugar.</p>
        <p class="hero__apoio" lang="en">Page not found. The address you tried does not exist or has moved.</p>
        <div class="botoes">
          <a class="botao" href="/">Ir para o início</a>
          <a class="botao" href="/en/" lang="en">Go to the English site</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span data-ano-atual>2026</span> Inflaming Hearts</p>
    </div>
  </footer>

  <script src="/js/ano.js" defer></script>
</body>
</html>
